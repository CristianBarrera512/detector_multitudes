<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Multitudes</title>
    <link rel="stylesheet" href="estilos.css">
</head>

<body>
    <main class="contenedor">

        <header class="encabezado">
            <h1>Control de Multitudes</h1>
            <p>Sistema de monitoreo inteligente</p>
        </header>
        <div class="barra-camara">
            <h2>Cámara en vivo</h2>

            <span id="indicador-camara" class="indicador-camara">
                ● Desconectada
            </span>
        </div>
        <div class="panel-camara">
            <video id="camara" autoplay playsinline muted style="display: block; width: 100%; height: auto;">
            </video>

            <canvas id="recuadros" style="position: absolute; top: 0; left: 0;
                width: 100%; height: 100%; pointer-events: none;">
            </canvas>
        </div>

        <button id="iniciar">Activar cámara</button>
        <p id="estado">Cámara apagada</p>

        <section class="panel-estadisticas">
            <div class="tarjeta">
                <h3>personas detectadas</h3>
                <p id="contador-personas">0</p>
            </div>

            <div class="tarjeta" id="tarjeta-alerta">
                <h3>Estado del sistema</h3>
                <p id="estado-alerta">Normal</p>
            </div>
        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    <script src="script.js?v=4"></script>
</body>

</html>
